name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-abi-history:
    name: sdk ABI history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang 20
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
      - name: Verify golden ABI history
        run: >
          python3 -B cmake/verify_sdk_abi.py
          --compiler clang++-20
          --include-dir include
          --history cmake/sdk_abi_history.json
      - name: Exercise ABI history mutation rules
        run: python3 -B test/test_sdk_abi_history.py

  sdk-layout-32:
    name: sdk layout / 32-bit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install 32-bit GCC support
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-13-multilib
      - name: Compile SDK layout assertions
        run: >
          g++-13 -m32 -std=c++23 -fsyntax-only -Iinclude
          test/sdk_layout_32.cpp

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "gcc / default", cc: gcc-13, cxx: g++-13, toolchain: default.cmake, build_type: Debug}
          - {name: "gcc / asan", cc: gcc-13, cxx: g++-13, toolchain: address.cmake, build_type: Debug}
          - {name: "gcc / tsan", cc: gcc-13, cxx: g++-13, toolchain: thread.cmake, build_type: RelWithDebInfo}
          - {name: "gcc / ubsan", cc: gcc-13, cxx: g++-13, toolchain: undefined.cmake, build_type: Debug}
          - {name: "clang / default", cc: clang, cxx: clang++, toolchain: default.cmake, build_type: Debug}
          - {name: "clang / asan", cc: clang, cxx: clang++, toolchain: address.cmake, build_type: Debug}
          - {name: "clang / tsan", cc: clang, cxx: clang++, toolchain: thread.cmake, build_type: RelWithDebInfo}
          - {name: "clang / ubsan", cc: clang, cxx: clang++, toolchain: undefined.cmake, build_type: Debug}
    steps:
      - uses: actions/checkout@v5
      - name: Install SSH server test dependencies
        run: sudo apt-get install --yes libssl-dev openssh-client
      - name: Install Clang 20
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION" /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/${{ matrix.toolchain }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumer:
    name: consumer / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, cxx: g++-13}
          - {compiler: clang, cxx: clang++}
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang 20
        if: ${{ matrix.compiler == 'clang' }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION" /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
      - name: Verify all consumer modes
        env:
          CXX: ${{ matrix.cxx }}
        run: example/consumer/verify.sh

  container:
    name: hardened container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify the hardened deployment
        run: python3 test/test_container.py
