name: anvil

services:
  anvil:
    image: anvil:${ANVIL_IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${ANVIL_TMPFS_LIMIT:-16m},mode=1777
    volumes:
      - anvil-state:/var/lib/anvil
    secrets:
      - authorized_key
      - tos_text
    ports:
      - "${ANVIL_PORT:-2222}:2222"
    pids_limit: ${ANVIL_PID_LIMIT:-256}
    mem_limit: ${ANVIL_MEMORY_LIMIT:-512m}
    cpus: ${ANVIL_CPU_LIMIT:-2.0}
    stop_grace_period: 10s
    command:
      - --bind-address
      - 0.0.0.0
      - --port
      - "2222"
      - --health-bind-address
      - 127.0.0.1
      - --health-port
      - "8080"
      - --database
      - /var/lib/anvil/anvil.db
      - --registration-mode
      - "${ANVIL_REGISTRATION_MODE:-open}"
      - --invites-per-user
      - "${ANVIL_INVITES_PER_USER:-5}"
      - --invite-regeneration-seconds
      - "${ANVIL_INVITE_REGENERATION_SECONDS:-2592000}"
      - --invite-expiration-seconds
      - "${ANVIL_INVITE_EXPIRATION_SECONDS:-604800}"
      - --notify-inviters-on-moderation
      - "${ANVIL_NOTIFY_INVITERS_ON_MODERATION:-off}"
      - --tos-version
      - "${ANVIL_TOS_VERSION:?set ANVIL_TOS_VERSION to the current opaque version}"
      - --tos-file
      - /run/secrets/tos_text
      - --board
      - "general=${ANVIL_GENERAL_BOARD_TITLE:-General}"
      - --guest-report-rate-limit
      - "${ANVIL_GUEST_REPORT_RATE_LIMIT:-5/3600}"
      - --backup-directory
      - /var/lib/anvil/backups
      - --backup-interval-seconds
      - "86400"
      - --backup-retention-seconds
      - "604800"
      - --host-key
      - /var/lib/anvil/host_key
      - --authorized-key
      - "${ANVIL_USER:-demo}=/run/secrets/authorized_key"

secrets:
  authorized_key:
    file: ${ANVIL_AUTHORIZED_KEY:?set ANVIL_AUTHORIZED_KEY to an OpenSSH public-key file}
  tos_text:
    file: ${ANVIL_TOS_FILE:?set ANVIL_TOS_FILE to a UTF-8 terms-of-service file}

volumes:
  anvil-state:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
